<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo dõi đơn hàng SPX</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1f2330; --muted: #6b7280;
    --border: #e5e7eb; --primary: #ee4d2d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .muted { color: var(--muted); font-size: 13px; }

  /* Menu ngang */
  .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .tab {
    --c: #374151;
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--card); color: var(--text); font: inherit; font-size: 14px;
    cursor: pointer; white-space: nowrap;
  }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .tab .count { font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #f3f4f6; }
  .tab.active { border-color: var(--c); color: var(--c); }
  .tab.active .count { background: var(--c); color: #fff; }

  /* Ô nhập & nút */
  textarea {
    width: 100%; min-height: 80px; padding: 10px 12px; font: inherit; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; resize: vertical;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .btn {
    padding: 9px 16px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; font: inherit; font-size: 14px; cursor: pointer;
  }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  input[type="search"] {
    flex: 1; min-width: 200px; padding: 9px 12px; font: inherit; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .link-btn { background: none; border: none; color: #dc2626; cursor: pointer; font: inherit; font-size: 13px; }

  /* Bảng */
  .card.table-wrap { padding: 0; overflow-x: auto; }
  table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #fafafa; font-size: 12px; text-transform: uppercase; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  td a { color: var(--primary); font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .right { text-align: right; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }

  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #f3f4f6; color: var(--muted); }
  .badge.ok { background: #dcfce7; color: #15803d; }
  .badge.cancel { background: #fee2e2; color: #b91c1c; }
  .badge.transit { background: #dbeafe; color: #1d4ed8; }
  .badge.err { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>
<div class="container">
  <h1>📦 Theo dõi đơn hàng SPX</h1>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-filter="all" style="--c:#374151">
      <span class="dot"></span>Tổng đơn <span class="count" data-count="all">0</span>
    </button>
    <button class="tab" data-filter="delivered" style="--c:#16a34a">
      <span class="dot"></span>Đã giao thành công <span class="count" data-count="delivered">0</span>
    </button>
    <button class="tab" data-filter="cancelled" style="--c:#dc2626">
      <span class="dot"></span>Đã huỷ <span class="count" data-count="cancelled">0</span>
    </button>
    <button class="tab" data-filter="in_transit" style="--c:#2563eb">
      <span class="dot"></span>Đang vận chuyển <span class="count" data-count="in_transit">0</span>
    </button>
  </nav>

  <section class="card">
    <label for="codes"><strong>Nhập mã vận đơn SPX</strong> <span class="muted">(mỗi mã một dòng, hoặc cách nhau bằng dấu phẩy / khoảng trắng)</span></label>
    <textarea id="codes" placeholder="SPXVN0123456789&#10;SPXVN0987654321"></textarea>
    <div class="actions">
      <button class="btn primary" id="btnAdd">Thêm &amp; kiểm tra</button>
      <button class="btn" id="btnRefresh">Cập nhật tất cả</button>
      <input type="search" id="search" placeholder="Tìm theo mã vận đơn...">
    </div>
    <div class="muted" id="msg" style="margin-top:8px"></div>
  </section>

  <section class="card table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>Mã vận đơn</th><th>Trạng thái</th><th>Cập nhật lúc</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty"></div>
  </section>
</div>

<script>
// ===== CẤU HÌNH =====
const CONFIG = {
  // Để trống = chế độ demo (trạng thái giả lập).
  // Khi có backend của bạn, điền URL vào đây, ví dụ: 'https://api.cuaban.com/spx/track'
  API_URL: '',
  AUTO_REFRESH_MINUTES: 10,   // tự cập nhật các đơn chưa giao / chưa huỷ
};

const STATUS = {
  delivered:  { label: 'Đã giao thành công', cls: 'ok' },
  cancelled:  { label: 'Đã huỷ',             cls: 'cancel' },
  in_transit: { label: 'Đang vận chuyển',    cls: 'transit' },
};

const orders = new Map();   // mã -> { code, status, statusText, updatedAt, loading, error }
let currentFilter = 'all';
let keyword = '';

const $ = id => document.getElementById(id);
const setMsg = text => { $('msg').textContent = text; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = iso => new Date(iso).toLocaleString('vi-VN');

// ===== LẤY TRẠNG THÁI =====
async function fetchStatus(code) {
  if (!CONFIG.API_URL) return mockStatus(code);

  const res = await fetch(`${CONFIG.API_URL}?code=${encodeURIComponent(code)}`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const d = await res.json();   // backend trả về: { status, statusText, updatedAt }
  const status = STATUS[d.status] ? d.status : 'in_transit';
  return {
    status,
    statusText: d.statusText || STATUS[status].label,
    updatedAt: d.updatedAt || new Date().toISOString(),
  };
}

// Demo: sinh trạng thái cố định theo mã để thử giao diện
function mockStatus(code) {
  let h = 0;
  for (const ch of code) h = (h * 31 + ch.charCodeAt(0)) % 1000003;
  const pool = ['delivered', 'delivered', 'in_transit', 'in_transit', 'cancelled'];
  const status = pool[h % pool.length];
  return { status, statusText: STATUS[status].label, updatedAt: new Date().toISOString() };
}

async function checkCodes(codes) {
  if (!codes.length) return;
  codes.forEach(c => Object.assign(orders.get(c), { loading: true, error: false }));
  render();

  const results = await Promise.allSettled(codes.map(fetchStatus));
  results.forEach((r, i) => {
    const o = orders.get(codes[i]);
    if (!o) return;                       // đã bị xoá trong lúc chờ
    o.loading = false;
    if (r.status === 'fulfilled') Object.assign(o, r.value);
    else o.error = true;
  });
  render();
}

// ===== THÊM / CẬP NHẬT =====
function parseCodes(text) {
  const list = text.split(/[\s,;]+/)
    .map(s => s.trim().toUpperCase())
    .filter(s => /^[A-Z0-9]{6,30}$/.test(s));
  return [...new Set(list)];
}

$('btnAdd').onclick = async () => {
  const codes = parseCodes($('codes').value);
  if (!codes.length) return setMsg('Không tìm thấy mã vận đơn hợp lệ.');

  const fresh = codes.filter(c => !orders.has(c));
  fresh.forEach(c => orders.set(c, { code: c, status: null, statusText: '', updatedAt: null, loading: true, error: false }));
  $('codes').value = '';
  if (!fresh.length) return setMsg('Các mã này đã có trong danh sách.');

  setMsg(`Đang kiểm tra ${fresh.length} mã...`);
  await checkCodes(fresh);
  setMsg(`Đã cập nhật ${fresh.length} mã mới.`);
};

$('btnRefresh').onclick = async () => {
  setMsg('Đang cập nhật tất cả...');
  await checkCodes([...orders.keys()]);
  setMsg('Đã cập nhật xong.');
};

// Tự động cập nhật các đơn chưa hoàn tất
setInterval(() => {
  const active = [...orders.values()]
    .filter(o => o.status !== 'delivered' && o.status !== 'cancelled')
    .map(o => o.code);
  if (active.length) checkCodes(active);
}, CONFIG.AUTO_REFRESH_MINUTES * 60 * 1000);

// ===== HIỂN THỊ =====
function badge(o) {
  if (o.loading) return '<span class="badge">Đang kiểm tra…</span>';
  if (o.error) return '<span class="badge err">Lỗi tra cứu</span>';
  if (!o.status) return '<span class="badge">Chưa có dữ liệu</span>';
  const s = STATUS[o.status];
  return `<span class="badge ${s.cls}">${esc(o.statusText || s.label)}</span>`;
}

function render() {
  const all = [...orders.values()];

  // Đếm số lượng cho từng menu
  const counts = { all: all.length, delivered: 0, cancelled: 0, in_transit: 0 };
  all.forEach(o => { if (o.status) counts[o.status]++; });
  for (const [key, n] of Object.entries(counts)) {
    document.querySelector(`[data-count="${key}"]`).textContent = n;
  }

  // Lọc theo menu + ô tìm kiếm
  const list = all.filter(o =>
    (currentFilter === 'all' || o.status === currentFilter) &&
    o.code.includes(keyword.toUpperCase())
  );

  $('rows').innerHTML = list.map((o, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><a href="https://spx.vn/track?${o.code}" target="_blank" rel="noopener">${o.code}</a></td>
      <td>${badge(o)}</td>
      <td class="muted">${o.updatedAt ? fmtTime(o.updatedAt) : '—'}</td>
      <td class="right"><button class="link-btn" data-del="${o.code}">Xoá</button></td>
    </tr>`).join('');

  $('empty').textContent = list.length ? '' :
    (all.length ? 'Không có đơn nào trong mục này.' : 'Chưa có đơn nào. Nhập mã vận đơn ở trên để bắt đầu.');
}

// ===== SỰ KIỆN =====
$('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  currentFilter = tab.dataset.filter;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
  render();
});

$('search').addEventListener('input', e => {
  keyword = e.target.value.trim();
  render();
});

$('rows').addEventListener('click', e => {
  const code = e.target.dataset.del;
  if (code) { orders.delete(code); render(); }
});

render();
</script>
</body>
</html>
